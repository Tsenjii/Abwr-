name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      long_background:
        description: 'Run the 1/10/30-minute screen-off background acceptance'
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
concurrency:
  group: abwr-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore pinned distribution key
        if: github.event_name != 'pull_request'
        env:
          ABWR_SIGNING_KEY_B64: ${{ secrets.ABWR_SIGNING_KEY_B64 }}
        run: python3 scripts/prepare_signing.py
      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMGR" || { echo "sdkmanager not available"; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Python protocol tests
        run: python3 -m unittest discover -s tests -v
      - name: WebExtension JavaScript tests
        run: |
          node tests/browser_content_mock_test.js
          node tests/bridge_behavior_test.js
          node tests/bridge_lifecycle_test.js
          node tests/bridge_coverage_test.js
          node tests/workbench_runtime_test.js
          node tests/http_runtime_test.js
      - name: Kotlin unit tests and Android APKs
        env:
          ABWR_STORE_PASSWORD: ${{ secrets.ABWR_STORE_PASSWORD || 'android' }}
          ABWR_KEY_PASSWORD: ${{ secrets.ABWR_KEY_PASSWORD || 'android' }}
          ABWR_KEY_ALIAS: ${{ secrets.ABWR_KEY_ALIAS || 'androiddebugkey' }}
        shell: bash
        run: |
          tasks=(:app:testDebugUnitTest :app:assembleDebug)
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then tasks+=(:app:assembleRelease); fi
          gradle "${tasks[@]}" --stacktrace
      - name: Record APK certificate
        shell: bash
        run: |
          SDK_APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$SDK_APKSIGNER"
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            "$SDK_APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee app/build/outputs/apk/release/signature.txt
            actual=$(sed -n 's/Signer #1 certificate SHA-256 digest: //p' app/build/outputs/apk/release/signature.txt)
            test "$actual" = "$(cat signing/certificate-sha256.txt)"
            sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/apk-sha256.txt
          fi
      - name: Record JVM test result counts
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          roots=[ET.parse(path).getroot() for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')]
          counts={key:sum(int(root.get(key, 0)) for root in roots) for key in ('tests','failures','errors','skipped')}
          assert counts['tests'] >= 37 and counts['failures'] == counts['errors'] == counts['skipped'] == 0, counts
          print('Kotlin JVM test results:', counts)
          PY
      - name: Upload JVM test evidence
        uses: actions/upload-artifact@v4
        with:
          name: Abwr-jvm-test-results
          path: app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: error
      - name: Upload installable signed APK
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Abwr-signed-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/signature.txt
            app/build/outputs/apk/release/apk-sha256.txt
          if-no-files-found: error
      - name: Upload developer APK for emulator checks
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abwr-dev-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  emulator:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: all
            api: 35
          - suite: all
            api: 33
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'Abwr-dev-apk' || 'Abwr-signed-apk' }}
          path: emulator-apk
      - name: Download pinned signed predecessor for data-preserving upgrade
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: Abwr-signed-apk
          run-id: 38386576654
          github-token: ${{ github.token }}
          path: baseline-apk
      - name: Verify predecessor APK hash
        if: github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('baseline-apk/app-release.apk').read_bytes()).hexdigest() == '8c066ab055e3597995b1f3679b97f433a29517b79981ab6748b6c2b1b2bf3cf9'
          PY
      - name: Install image verification dependency
        run: python3 -m pip install Pillow
      - name: Android emulator browser acceptance
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ABWR_CI_EMULATOR: '1'
          ABWR_CI_SUITE: ${{ matrix.suite }}
          ABWR_CI_ANDROID_API: ${{ matrix.api }}
          ABWR_CI_PACKAGE: ${{ github.event_name == 'pull_request' && 'dev.local.aibrowser.dev' || 'dev.local.aibrowser' }}
          ABWR_CI_LONG_BACKGROUND: ${{ github.event_name != 'pull_request' && github.event.inputs.long_background != 'false' && '1' || '0' }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          script: |
            bash scripts/install_ci_apk.sh
            if [ "$ABWR_CI_PACKAGE" = dev.local.aibrowser ]; then python3 scripts/android_ci_upgrade.py; fi
            python3 scripts/android_ci_smoke.py
      - name: Resolve native Gecko crash offsets
        if: always()
        run: python3 scripts/symbolicate_gecko.py --tombstone ci-device-evidence/native-crash-buffer.txt --output ci-device-evidence/native-symbols.json
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Abwr-emulator-evidence-${{ matrix.suite }}-api${{ matrix.api }}
          path: ci-device-evidence/
          if-no-files-found: warn
