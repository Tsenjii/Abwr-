name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: abwr-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Best-effort continuity for development installs. Cache eviction still
      # requires a durable release signing key before a production V1.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: abwr-debug-signing-v1-${{ runner.os }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMGR" || { echo "sdkmanager not available"; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Python protocol tests
        run: python3 -m unittest discover -s tests -v
      - name: WebExtension JavaScript tests
        run: |
          node tests/browser_content_mock_test.js
          node tests/bridge_behavior_test.js
      - name: Kotlin unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Record APK certificate
        shell: bash
        run: |
          SDK_APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$SDK_APKSIGNER"
          "$SDK_APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/signature.txt
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abwr-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/signature.txt
          if-no-files-found: error
